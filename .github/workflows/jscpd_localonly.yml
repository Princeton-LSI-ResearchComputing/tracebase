---
name: JSCPD

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: null

# Ensure top-level permissions are not write-all
permissions: read-all

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  jscpd:
    # Name the Job
    name: Check for code duplication
    # Set the type of machine to run on
    runs-on: ubuntu-latest

    # Set permissions for GITHUB_TOKEN
    # https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
    permissions:
      contents: read

      # To report GitHub Actions status checks
      statuses: write

    steps:
      # Checks out a copy of tracebase repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The JSCPD script uses git merge-base to determine
          # the files changed across commits in pull requests.
          fetch-depth: 0

      # Install Node.js (required by JSCPD)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install a pinned version of JSCPD for stability
      - name: Install JSCPD
        run: npm install --global jscpd@3.3.26

      # Optional sanity check to ensure the expected version is running
      - name: Verify JSCPD version
        run: jscpd --version

      # Run the repository's JSCPD wrapper script
      - name: Run JSCPD
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          bash .github/scripts/jscpd_localonly.sh
